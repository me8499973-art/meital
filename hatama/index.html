html,body{margin:0;color:var(--text);font-family:var(--sans);-webkit-text-size-adjust:100%;min-height:100%}
body{background:var(--night);

.wrap{max-width:560px;margin:0 auto;padding:0 20px 48px}

.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--edge);border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:700;color:var(--gold2);background:rgba(201,162,78,.08);margin:28px 0 14px}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--leaf);box-shadow:0 0 10px var(--leaf)}

h1{font-family:var(--serif);font-weight:900;font-size:clamp(38px,10.5vw,54px);line-height:1.04;letter-spacing:-.5px;margin:0 0 14px}

/* the glowing card */
.panel{position:relative;border-radius:22px;padding:22px 20px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));

.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--gold2));transition:width .45s ease}

textarea,.panel input{width:100%;font:inherit;color:var(--text);background:rgba(0,0,0,.25);border:1.5px solid var(--line);border-radius:14px;outline:none}
textarea{min-height:130px;resize:vertical;padding:14px 16px;font-family:var(--serif);font-size:20px;line-height:1.6}
textarea::placeholder,.panel input::placeholder{color:#7F978A}

.link{font:inherit;background:none;border:0;color:var(--soft);font-weight:700;font-size:15.5px;cursor:pointer;padding:8px 0}

.best .name{font-family:var(--serif);font-weight:900;font-size:clamp(30px,8vw,38px);margin:6px 0 10px}
.best p{font-size:16.5px;line-height:1.65;margin:0;color:var(--soft)}
.meter{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:4px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.also{display:grid;gap:10px;margin:0 0 24px}
.also div{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:14px;padding:14px}
.also b{font-size:16.5px}
.also .pct{font-weight:800;color:var(--soft)}
.also .meter{grid-column:1/-1;height:5px}
.also p{grid-column:1/-1;margin:0;color:var(--soft);font-size:14.5px;line-height:1.55}

.talk h3{font-family:var(--serif);font-weight:700;font-size:25px;margin:0 0 10px}
.talk ol{margin:0 0 18px;padding-right:20px;line-height:1.75;font-size:16px;color:var(--soft)}
.talk input{padding:14px;font-size:16.5px;margin-bottom:10px}
.send{display:grid;gap:10px;margin-top:6px}
.send button{font:inherit;font-weight:900;font-size:18px;border:0;border-radius:14px;padding:16px;cursor:pointer}
.wa{background:#25D366;color:#063A20;box-shadow:0 12px 30px -12px rgba(37,211,102,.6)}
.mail{background:transparent;color:var(--text);border:1.5px solid var(--line)!important}
.send button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.fine{font-size:13.5px;color:#93A99B;line-height:1.55;margin:14px 0 0}

footer{padding:30px 0 0;color:#93A99B;font-size:14px;line-height:1.8}
footer a{color:var(--gold2);font-weight:700;text-decoration:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

 {id:'who',type:'one',q:'מה הייתם מעדיפים?',sub:'אין תשובה נכונה.',

function live(){return STEPS.filter(function(s){return !s.show||s.show()})}
var cur=0;

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function go(n){cur=n;render();window.scrollTo(0,0)}
function panel(inner,pct){return '<div class="panel"><div class="prog"><i style="width:'+pct+'%"></i></div>'+inner+'</div>'}

var DOORS={

function render(){

  if(s.type==='text')return renderText(st);
  if(s.type==='result')return renderThinking(st);

  }
  h+='<h2>'+s.q+'</h2>'+(s.sub?'<p class="sub">'+s.sub+'</p>':'');
  h+='<div class="rows '+(s.type==='multi'?'multi':'')+'">';
  s.opts.forEach(function(o){
    var on= s.type==='multi' ? !!A.topics[o[0]] : A[s.id]===o[0];

  st.querySelectorAll('.row').forEach(function(b){

      var v=b.getAttribute('data-v');

    '<p class="lead">כתבו מה הכי מעיק עליכם. השאלון ישאל כמה שאלות המשך, ויחזיר לכם אחוז התאמה לכל אחת משלוש הדרכים שלי.</p>'+
    panel('<div class="preview">'+
      ['המשרד האוטומטי','מזכירה מרחוק','סרטונים וסטטוסים'].map(function(t){return '<div class="pv"><div><span>'+t+'</span><b>?%</b></div><div class="bar"><i></i></div></div>'}).join('')+
      '</div><label class="tag" for="painT">✍️ מה הכי מעיק עליכם בעסק עכשיו?</label>'+
      '<textarea id="painT" placeholder="אני כל הערב עונה להודעות, ולקוחות שוכחים לשלם לי…">'+esc(A.pain)+'</textarea>'+
      '<div class="ideas">'+IDEAS.map(function(i){return '<button type="button">'+i+'</button>'}).join('')+'</div>'+
      '<div class="err" id="err" role="alert"></div>'+
      '<div class="nav"><button class="btn" id="next">לגלות מה מתאים לי</button><span></span></div>',0);
  st.querySelectorAll('.ideas button').forEach(function(b){b.onclick=function(){var t=$('painT');t.value=(t.value?t.value.replace(/\s*$/,'')+'. ':'')+b.textContent;t.focus()}});
  $('next').onclick=function(){
    var t=$('painT').value.trim();
    if(t.length<3){$('err').textContent='כתבו כמה מילים, או בחרו אחד מהמשפטים.';return}
    A.pain=t; A.topics=detect(t); track('התאמה-כתב'); go(cur+1);
  };
}

function score(){
  var T=A.topics, sec=0, sys=0, vid=0;
  if(T.admin){sec+=3;sys+=1}
  if(T.money){sec+=2;sys+=2}
  if(T.clients){sec+=1;sys+=3}
  if(T.growth){vid+=5}
  ({person:function(){sec+=4},auto:function(){sys+=4},both:function(){sec+=2;sys+=2}}[A.who]||function(){})();
  ({head:function(){sec+=1;sys+=2},wa:function(){sec+=1;sys+=2},excel:function(){sys+=2},soft:function(){sec+=2}}[A.where]||function(){})();
  if(A.hours==='3'||A.hours==='4')sec+=2;
  if(A.size==='l'||A.size==='xl')sys+=2;
  ({none:function(){vid+=2},self:function(){vid+=1},nores:function(){vid+=3},nottime:function(){vid+=3}}[A.mkt]||function(){})();
  var raw=[['sec',sec],['sys',sys],['vid',vid]], max=Math.max(sec,sys,vid,1);
  return raw.map(function(r){return [r[0], r[1]? Math.round(38+(r[1]/max)*56) : 12]}).sort(function(a,b){return b[1]-a[1]});
}

function summary(){
  var o=function(id){var s=STEPS.filter(function(x){return x.id===id})[0];var f=s&&s.opts.filter(function(p){return p[0]===A[id]})[0];return f?f[2]:''};
  var L=['היי מיטל, מילאתי את "מה מתאים לעסק שלי" 🙂','',
    'מה הכי מעיק עליי: '+A.pain,
    'נוגע לי: '+Object.keys(A.topics).map(function(k){return TOPICS[k].name}).join(', ')];
  if(A.hours)L.push('זמן בשבוע: '+o('hours'));
  if(A.who)L.push('מעדיף/ה: '+o('who'));
  if(A.where)L.push('המידע היום: '+o('where'));
  if(A.size)L.push('לקוחות בחודש: '+o('size'));
  if(A.mkt)L.push('שיווק היום: '+o('mkt'));
  L.push('','ההתאמה שיצאה לי: '+score().map(function(r){return DOORS[r[0]].t+' '+r[1]+'%'}).join(', '));
  if(A.name)L.push('','שם: '+A.name);
  if(A.back)L.push('לחזור אליי: '+A.back);
  return L.join('\n');
}

/* the one orchestrated moment: a short "putting it together" beat, then the reveal */
function renderThinking(st){
  st.innerHTML='<div style="height:26px"></div>'+panel('<div class="think"><div class="ring"></div><p>מחברת את כל התשובות שלכם…</p><small>עוד רגע תראו מה הכי מתאים לעסק שלכם</small></div>',100);
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(function(){renderResult(st)},reduce?0:1700);
}

function renderResult(st){
  var R=score(), b=DOORS[R[0][0]];
  var h='<div class="best"><p class="who">לפי מה שסיפרתם, הכי מתאים לכם</p>'+
    '<div class="num" id="num">0%</div><div class="name">'+b.t+'</div>'+
    '<div class="meter" style="margin:0 0 14px"><i data-w="'+R[0][1]+'" style="background:'+b.c+'"></i></div><p>'+b.why()+'</p></div>'+
    '<div class="also">';
  R.slice(1).forEach(function(r){var d=DOORS[r[0]];
    h+='<div><b>'+d.t+'</b><span class="pct">'+r[1]+'%</span><span class="meter"><i data-w="'+r[1]+'" style="background:'+d.c+'"></i></span><p>'+d.why()+'</p></div>';
  });
  h+='</div><div class="talk"><h3>ומה עכשיו? שיחה של 10 דקות</h3><ol><li>תספרו לי קצת יותר על העסק.</li><li>אגיד לכם בדיוק מה אפשר להוריד מכם, גם אם בסוף לא נעבוד יחד.</li><li>ואפשר להפסיק בסוף כל חודש, בלי התחייבות.</li></ol>'+
     '<input type="text" id="nm" placeholder="איך קוראים לכם?" value="'+esc(A.name)+'" autocomplete="name" aria-label="שם">'+
     '<input type="tel" id="bk" placeholder="טלפון או מייל לחזרה (לא חובה)" value="'+esc(A.back)+'" autocomplete="tel" aria-label="טלפון או מייל">'+
     '<div class="err" id="err" role="alert"></div><div class="send"><button class="wa" id="sWa">שליחת התוצאה בוואטסאפ</button><button class="mail" id="sMail">שליחה במייל</button></div>'+
     '<p class="fine">נפתח וואטסאפ או מייל עם התשובות כבר כתובות. נשאר רק ללחוץ "שלח", ואחזור אליכם תוך יום עסקים.</p></div>'+
     '<div class="nav"><button class="link" id="again">להתחיל מחדש</button><button class="link" id="prev">חזרה</button></div>';
  st.innerHTML='<div style="height:26px"></div>'+panel(h,100);
  track('התאמה-תוצאה');
  setTimeout(function(){st.querySelectorAll('.meter i').forEach(function(i){i.style.width=i.getAttribute('data-w')+'%'})},80);
  var target=R[0][1], n=0, el=$('num'), t0=null;
  (function tick(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/1100);n=Math.round(target*(1-Math.pow(1-p,3)));el.textContent=n+'%';if(p<1)requestAnimationFrame(tick)})(performance.now());
  function send(kind){
    A.name=$('nm').value.trim(); A.back=$('bk').value.trim();
    if(!A.name){$('err').textContent='רק השם חסר.';$('nm').focus();return}
    var t=summary();
    if(kind==='wa'){track('התאמה-נשלח-וואטסאפ');location.href='https://wa.me/972548499973?text='+encodeURIComponent(t)}
    else{track('התאמה-נשלח-מייל');location.href='mailto:me8499973@gmail.com?subject='+encodeURIComponent('מה מתאים לעסק שלי · סדר בעסק')+'&body='+encodeURIComponent(t)}
  }
  $('sWa').onclick=function(){send('wa')};
  $('sMail').onclick=function(){send('mail')};
  $('prev').onclick=function(){go(cur-1)};
  $('again').onclick=function(){A={pain:'',topics:{},hours:'',who:'',where:'',size:'',mkt:'',name:'',back:''};go(0)};
}
render();
</script>
