  ({person:function(){sec+=4},auto:function(){sys+=4},both:function(){sec+=2;sys+=2}}[A.who]||function(){})();
  ({head:function(){sec+=1;sys+=2},wa:function(){sec+=1;sys+=2},excel:function(){sys+=2},soft:function(){sec+=2}}[A.where]||function(){})();

  return raw.map(function(r){return [r[0], r[1]? Math.round(38+(r[1]/max)*56) : 12]}).sort(function(a,b){return b[1]-a[1]});
}

    'נוגע לי: '+Object.keys(A.topics).map(function(k){return TOPICS[k].name}).join(', ')];
  if(A.hours)L.push('זמן בשבוע: '+o('hours'));
  if(A.who)L.push('מעדיף/ה: '+o('who'));
  if(A.where)L.push('המידע היום: '+o('where'));
  if(A.size)L.push('לקוחות בחודש: '+o('size'));
  if(A.mkt)L.push('שיווק היום: '+o('mkt'));
  L.push('','ההתאמה שיצאה לי: '+score().map(function(r){return DOORS[r[0]].t+' '+r[1]+'%'}).join(', '));
  if(A.name)L.push('','שם: '+A.name);
  if(A.back)L.push('לחזור אליי: '+A.back);
  return L.join('\n');
}

function renderResult(st){

    '<div class="also">';

    h+='<div><b>'+d.t+'</b><span class="pct">'+r[1]+'%</span><span class="meter"><i data-w="'+r[1]+'" style="background:'+d.c+'"></i></span><p>'+d.why()+'</p></div>';
  });
  h+='</div><section class="talk"><h3>ומה עכשיו? שיחה של 10 דקות</h3><ol><li>תספרו לי קצת יותר על העסק.</li><li>אגיד לכם בדיוק מה אפשר להוריד מכם, גם אם בסוף לא נעבוד יחד.</li><li>ואפשר להפסיק בסוף כל חודש, בלי התחייבות.</li></ol>'+
     '<input type="text" id="nm" placeholder="איך קוראים לכם?" value="'+esc(A.name)+'" autocomplete="name" aria-label="שם">'+
     '<input type="tel" id="bk" placeholder="טלפון או מייל לחזרה (לא חובה)" value="'+esc(A.back)+'" autocomplete="tel" aria-label="טלפון או מייל">'+
     '<div class="err" id="err" role="alert"></div><div class="send"><button class="wa" id="sWa">שליחה בוואטסאפ</button><button class="mail" id="sMail">שליחה במייל</button></div>'+
     '<p class="fine">נפתח וואטסאפ או מייל עם התשובות כבר כתובות. נשאר רק ללחוץ "שלח", ואחזור אליכם תוך יום עסקים.</p></section>'+
     '<div class="nav"><button class="link" id="again">להתחיל מחדש</button><button class="link" id="prev">חזרה</button></div>';
  st.innerHTML=h;
  track('התאמה-תוצאה');
  setTimeout(function(){st.querySelectorAll('.meter i').forEach(function(i){i.style.width=i.getAttribute('data-w')+'%'})},80);
  function send(kind){
    A.name=$('nm').value.trim(); A.back=$('bk').value.trim();
    if(!A.name){$('err').textContent='רק השם חסר.';$('nm').focus();return}
    var t=summary();
    if(kind==='wa'){track('התאמה-נשלח-וואטסאפ');location.href='https://wa.me/972548499973?text='+encodeURIComponent(t)}
    else{track('התאמה-נשלח-מייל');location.href='mailto:me8499973@gmail.com?subject='+encodeURIComponent('מה מתאים לעסק שלי · סדר בעסק')+'&body='+encodeURIComponent(t)}
  }
  $('sWa').onclick=function(){send('wa')};
  $('sMail').onclick=function(){send('mail')};
  $('prev').onclick=function(){go(cur-1)};
  $('again').onclick=function(){A={pain:'',topics:{},hours:'',who:'',where:'',size:'',mkt:'',name:'',back:''};go(0)};
}
render();
