<style>
:root{--cream:#FBF6EF;--paper:#fff;--gold:#AD8A57;--gold2:#E8C989;--ink:#3E2C1C;--soft:#7A6347;--line:rgba(173,138,87,.3)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:Heebo,Arial,sans-serif}
body{background:radial-gradient(circle at 50% 0%,#FFFDF9 0%,var(--cream) 45%,#F1E6D6 100%) fixed}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.bsd{color:var(--gold);font-weight:600;font-size:14px}
.top a{color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;border:1px solid var(--line);border-radius:999px;padding:8px 16px;background:rgba(255,255,255,.6)}
.hero{text-align:center;padding:10px 0 34px}
.hero img{width:200px;max-width:50vw}
.eyebrow{font-family:"Frank Ruhl Libre",serif;color:var(--gold);font-size:22px;margin:8px 0 2px}
h1{font-weight:800;font-size:clamp(34px,7vw,56px);line-height:1.1;margin:0 0 14px}
.lead{font-weight:300;font-size:19px;line-height:1.6;color:var(--soft);max-width:560px;margin:0 auto}
.line{width:180px;height:2px;margin:24px auto 0;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold2) 50%,var(--gold) 80%,transparent)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding-bottom:40px}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
.card{all:unset;cursor:pointer;display:block;background:var(--paper);border-radius:22px;overflow:hidden;box-shadow:0 16px 40px rgba(62,44,28,.10);border:1px solid var(--line);transition:transform .25s,box-shadow .25s}
.card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 22px 50px rgba(62,44,28,.16)}
.thumb{position:relative;aspect-ratio:9/16;background:#1b1714}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:auto auto 14px 14px;width:52px;height:52px;border-radius:50%;background:rgba(255,253,249,.92);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.play::before{content:"";margin-left:4px;border-left:16px solid var(--ink);border-top:10px solid transparent;border-bottom:10px solid transparent}
.tag{position:absolute;top:12px;right:12px;background:rgba(27,23,20,.6);color:#F2E6D2;font-size:12.5px;padding:4px 10px;border-radius:999px}
.cap{padding:14px 16px 16px}
.cap b{display:block;font-size:18px;font-weight:800;margin-bottom:3px}
.cap span{font-size:14.5px;color:var(--soft)}
@media (max-width:760px){.cap{padding:10px 12px 12px}.cap b{font-size:15.5px}.cap span{font-size:13px}.play{width:42px;height:42px}}
.cta{text-align:center;padding:30px 16px 60px}
.cta h2{font-weight:800;font-size:clamp(26px,5vw,38px);margin:0 0 6px}
.cta p{font-family:"Frank Ruhl Libre",serif;color:var(--gold);font-size:22px;margin:0 0 22px}
.wa{display:inline-flex;align-items:center;gap:12px;background:#25D366;color:#fff;text-decoration:none;font-weight:800;font-size:21px;padding:16px 30px;border-radius:999px;box-shadow:0 12px 28px rgba(37,211,102,.35)}
.wa svg{width:28px;height:28px}
.tel{display:block;margin-top:14px;color:var(--ink);font-weight:600;text-decoration:none;font-size:18px}
footer{text-align:center;color:var(--soft);font-size:13px;padding:0 0 30px}
.modal{position:fixed;inset:0;background:rgba(15,12,9,.88);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.on{display:flex}
.modal video{max-height:88vh;max-width:100%;aspect-ratio:9/16;border-radius:18px;background:#000}
.x{position:absolute;top:14px;left:14px;width:46px;height:46px;border-radius:50%;border:0;background:#fff;font-size:24px;cursor:pointer;color:var(--ink)}
</style>
</head>
<body>

    <div class="line"></div>
  </header>

  <main class="grid" id="grid"></main>
</div>

<section class="cta">

    <svg viewBox="0 0 32 32"><path fill="#fff" d="M16 3C9 3 3.3 8.6 3.3 15.6c0 2.3.6 4.5 1.8 6.4L3.2 29l7.2-1.9c1.8 1 3.8 1.5 5.9 1.5 7 0 12.7-5.7 12.7-12.6S23 3 16 3zm0 23.1c-1.9 0-3.7-.5-5.3-1.5l-.4-.2-4.3 1.1 1.1-4.2-.3-.4c-1.1-1.7-1.6-3.6-1.6-5.5C5.2 9.8 10 5.1 16 5.1s10.7 4.7 10.7 10.5S22 26.1 16 26.1zm5.9-7.8c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-1.9-1.8-2.2-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.7 5.8 5.1 2.9 1.1 3.4.9 4 .8.6-.1 1.9-.8 2.2-1.5.3-.8.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4z"/></svg>
    וואטסאפ

  <a class="tel" href="tel:0548499973">054-8499973</a>

<footer>מיטל עסיסי · סדר בעסק · משרד אנושי, מערכת חכמה</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <button class="x" id="x" aria-label="סגירה">×</button>
  <video id="player" controls playsinline></video>

<script>
const V = [
  ['a/v73', 'אל תפתחו את ההודעה הזאת', 'הודעת תודה שהופכת למתנה', 'לעסקים'],
  ['a/w1', 'סרטון תוכן עם בעל העסק', 'עריכת צילום, כתוביות, תמונות וצלילים', 'לעסקים'],
  ['a/v71', 'עריכה בתוך סרטון', 'מחליפים טקסט בלי לצלם מחדש', 'לעסקים'],
  ['a/w5', 'מחפשים מתנה שעושה וואו?', 'פרסומת לחנות בלונים ומתנות', 'לעסקים'],
  ['a/w3', 'מורה נהיגה', 'סרטון תדמית', 'לעסקים'],
  ['a/w4', 'המסלול לרישיון', 'סרטון הסבר לתלמידים', 'לעסקים'],
  ['a/w2', 'אימון באמנות', 'סטטוס מונפש לעסק', 'לעסקים'],
  ['../boutique/a/v51', 'העוזרת השקופה', 'סרטון תדמית', 'לעסקים'],
  ['../boutique/a/v42', 'יש לכם שמחה בקרוב?', 'הזמנה מונפשת', 'לשמחות'],
  ['../boutique/a/v47', 'הזמנה אישית לכל שמחה', 'סרטון לשמחות ולילדים', 'לשמחות'],
  ['a/v74', 'מה אפשר ליצור לעסק', 'סרטון תדמית קצר', 'לעסקים'],
  ['a/v75', 'נעים להכיר', 'סרטון היכרות בסגנון בוטיק', 'מיתוג'],
  ['a/v70', 'העוזרת הקולית', 'הדגמה של מערכת', 'לעסקים'],
  ['../boutique/a/brand', 'סדר בעסק בפנים חדשות', 'סרטון מותג', 'מיתוג'],
];
const grid = document.getElementById('grid'), modal = document.getElementById('modal'), player = document.getElementById('player');
V.forEach(([src, t, s, tag]) => {
  const poster = src.endsWith('brand') ? '../boutique/a/brand-poster.jpg' : src + '.jpg';
  const b = document.createElement('button');
  b.className = 'card';
  b.innerHTML = `<div class="thumb"><img src="${poster}" alt="" loading="lazy"><span class="tag">${tag}</span><span class="play"></span></div><div class="cap"><b>${t}</b><span>${s}</span></div>`;
  b.onclick = () => { player.src = src + '.mp4'; player.poster = poster; modal.classList.add('on'); player.play().catch(() => {}); };
  grid.appendChild(b);
});
const close = () => { player.pause(); player.removeAttribute('src'); player.load(); modal.classList.remove('on'); };
document.getElementById('x').onclick = close;
modal.onclick = e => { if (e.target === modal) close(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
</script>
